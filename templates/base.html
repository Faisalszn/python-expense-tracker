<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/mizan-icon.png') }}"
    >
</head>
<body>
    <nav>
        <a class="nav-brand" href="{{ url_for('home') }}">
            <img
                src="{{ url_for('static', filename='images/mizan-icon.png') }}"
                alt="Mizan"
            >

            <div class="nav-brand-text">
                <span class="nav-brand-name">MIZAN</span>
                <span class="nav-brand-subtitle">Personal Finance</span>
            </div>
        </a>

        <div class="nav-links">
            {% if session.get('user_id') %}
                <a href="{{ url_for('home') }}">Dashboard</a>
                <a href="{{ url_for('transactions') }}">Transactions</a>
                <a href="{{ url_for('add_transaction') }}">Add Transaction</a>
                <a href="{{ url_for('budgets') }}">Budgets</a>

                <span class="nav-user">{{ session.get('username') }}</span>

                <form class="nav-logout" action="{{ url_for('logout') }}" method="POST">
                    <button type="submit">Log Out</button>
                </form>
            {% else %}
                <a href="{{ url_for('login') }}">Log In</a>
                <a href="{{ url_for('register') }}">Create Account</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
