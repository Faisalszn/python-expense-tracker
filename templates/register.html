{% extends "base.html" %}

{% block title %}{{ t('register.title') }}{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-heading">
        <p class="eyebrow">{{ t('register.eyebrow') }}</p>
        <h1>{{ t('register.title') }}</h1>
        <p>{{ t('register.subtitle') }}</p>
    </div>

    <form class="transaction-form" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">{{ t('register.username') }}</label>
            <input
                id="username"
                type="text"
                name="username"
                required
                autofocus
            >
        </div>

        <div class="form-group">
            <label for="password">{{ t('register.password') }}</label>
            <input
                id="password"
                type="password"
                name="password"
                minlength="8"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password">{{ t('register.confirm_password') }}</label>
            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >
        </div>

        <div class="form-actions">
            <button class="form-submit" type="submit">
                {{ t('register.submit') }}
            </button>

            <a class="form-cancel" href="{{ url_for('login') }}">
                {{ t('register.have_account_link') }}
            </a>
        </div>

    </form>

</div>

{% endblock %}
